[versions]
agp                  = "8.7.0"
kotlin               = "2.0.0"
guava                = "33.3.1-android"
# 1.0.0-beta3+ need Kotlin 2.3 stdlib
mlkit-genai-prompt   = "1.0.0-beta2"

[libraries]
guava              = { group = "com.google.guava", name = "guava", version.ref = "guava" }
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkit-genai-prompt" }
okhttp             = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
shorthand          = "org.example:lib:1.2.3"

[plugins]
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version = "2.0.0-1.0.24" }
