[versions]
agp                  = "8.13.2"
kotlin               = "2.3.21"
core-ktx             = "1.18.0"
appcompat            = "1.8.0"
lifecycle            = "2.11.0"
coroutines           = "1.11.0"
serialization        = "1.12.0"
play-services-location = "21.4.0"
junit                = "4.13.2"
exifinterface        = "1.4.2"
androidx-test-runner     = "1.7.0"
androidx-test-ext-junit  = "1.3.0"
# App-only: the smoke test capsule sync generates uses espresso-web; the library itself does not.
espresso             = "3.7.0"
# Held on 4.x: 5.x is a major (Kotlin Multiplatform rewrite) — bump deliberately.
okhttp               = "4.12.0"
guava                = "33.7.2-android"
# Still a beta (the only ML Kit GenAI line); beta3+ need the Kotlin 2.3 stdlib (docs/guide/ai.md).
mlkit-genai-prompt   = "1.0.0-beta4"

[libraries]
androidx-core-ktx          = { group = "androidx.core",     name = "core-ktx",    version.ref = "core-ktx" }
androidx-appcompat         = { group = "androidx.appcompat", name = "appcompat",   version.ref = "appcompat" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
play-services-location     = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }
junit                      = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-exifinterface     = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-test-runner       = { group = "androidx.test",     name = "runner",                  version.ref = "androidx-test-runner" }
androidx-test-ext-junit    = { group = "androidx.test.ext", name = "junit",                   version.ref = "androidx-test-ext-junit" }
espresso-web               = { group = "androidx.test.espresso", name = "espresso-web", version.ref = "espresso" }
okhttp                     = { group = "com.squareup.okhttp3", name = "okhttp",          version.ref = "okhttp" }
guava                      = { group = "com.google.guava", name = "guava",             version.ref = "guava" }
mlkit-genai-prompt         = { group = "com.google.mlkit", name = "genai-prompt",      version.ref = "mlkit-genai-prompt" }

[plugins]
android-library      = { id = "com.android.library",            version.ref = "agp"    }
android-application  = { id = "com.android.application",        version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
